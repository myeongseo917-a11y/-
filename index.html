        h1 {
            color: #2a75d3;
            font-size: 28px;
            margin-bottom: 15px;
        }
        .welcome-box {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 15px 20px;
            max-width: 750px;
            margin: 0 auto 25px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            line-height: 1.7;
            color: #444;
            font-size: 15px;
            word-break: keep-all;
        }
        .welcome-box p {
            margin: 6px 0;
        }
        .highlight {
            font-weight: bold;
            color: #2a75d3;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }
        .country-btn {
            font-size: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.2s;
        }
        .country-btn:hover {
            transform: scale(1.05);
            background-color: #ffd700;
        }
        .info-card {
            display: none;
            background: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border: 3px solid #2a75d3;
            text-align: left;
            animation: fadeIn 0.4s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .info-card h2 {
            text-align: center;
            margin-top: 0;
            color: #333;
            font-size: 26px;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 12px;
        }
        .country-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }
        .info-section {

        }
        .info-title {
            font-weight: bold;
            color: #2a75d3;
            font-size: 16px;
            margin-bottom: 6px;
        }

            font-size: 15px;
            color: #444;
            line-height: 1.6;
            background: #fcfcfc;
            padding: 15px;
